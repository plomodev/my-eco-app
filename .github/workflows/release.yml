name: Build and publish Windows executable

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build Windows x64 release
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained executable
        shell: pwsh
        run: >
          dotnet publish GameEcoBot.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/win-x64

      - name: Create release and attach executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "publish/win-x64/GameEcoBot.exe"
          $releaseJson = gh release view $tag --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.assets.name -contains "GameEcoBot.exe") {
              Write-Host "Release $tag already contains GameEcoBot.exe; skipping duplicate upload."
              exit 0
            }

            gh release upload $tag $exe --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }

          gh release create $tag $exe `
            --title "GameEcoBot $tag — Téléchargement Windows x64" `
            --notes "Exécutable autonome Windows x64. Le dépôt est privé : le téléchargement est réservé aux personnes ayant accès au dépôt." `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
