name: Build and publish Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish or update (for example v1.0.9)"
        required: true
        type: string
        default: "v1.0.9"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained Windows x64 executable
        run: dotnet publish GameEcoBot.csproj --configuration Release --runtime win-x64 --self-contained true --output release

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: GameEcoBot ${{ env.RELEASE_TAG }} — Téléchargement Windows x64
          body: |
            Exécutable autonome Windows x64.
            Le dépôt est privé : le téléchargement est réservé aux personnes ayant accès au dépôt.
          files: release/GameEcoBot.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
